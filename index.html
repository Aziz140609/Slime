<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Slime</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <script>
        var snd_ambience = null;
        var layoutSize = { 'w': 1024, 'h': 768};
        var X_POSITION = 1024 / 2;
        var Y_POSITION = 768 / 2;
        console.log("Scripts loaded, starting config...");
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
        }
    </style>
    <script src="assets/scripts/enemy.js"></script>
    <script src="assets/scripts/scenePlay.js"></script>
    <script src="assets/scripts/scenePlay2.js"></script>
    <script src="assets/scripts/scenePlay3.js"></script>
    <script src="assets/scripts/scenePlay4.js"></script>
    <script src="assets/scripts/scenePlay5.js"></script>
    <script src="assets/scripts/scenePlay6.js"></script>
    <script src="assets/scripts/scenePlay7.js"></script>
    <script src="assets/scripts/scenePlay8.js"></script>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 672,
        height: 320,
        backgroundColor: '#3498db',
        parent: 'game-container',
        pixelArt: true,
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH
        },
        scene: [scenePlay, scenePlay2, scenePlay3, scenePlay4, scenePlay5, scenePlay6, scenePlay7, scenePlay8],
        physics: {
            default: 'arcade',
            arcade: {
               gravity: { y: 800 }
            }
        }
    };
    console.log("Initializing Phaser Game...");
    window.onload = function() {
        WebFont.load({
            google: {
                families: ['Press Start 2P']
            },
            active: function() {
                const game = new Phaser.Game(config);
            },
            inactive: function() {
                // Font gagal load, tetap jalankan game dengan fallback
                const game = new Phaser.Game(config);
            }
        });
    };
</script>
<div id="game-container"></div>
</body>
</html>
